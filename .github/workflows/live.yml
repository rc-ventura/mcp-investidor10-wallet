name: Live API

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      WALLET_ID: ${{ secrets.LIVE_WALLET_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Run the live tests against the real API
        run: |
          if [ -z "$WALLET_ID" ]; then
            echo "Segredo LIVE_WALLET_ID ausente: cadastre o ID da carteira fictícia nos segredos do repositório."
            exit 1
          fi
          uv run pytest -m live -q -p no:cacheprovider --tb=line
