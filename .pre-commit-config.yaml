repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-wallet-id
        name: no wallet ID in tracked files
        entry: scripts/check-no-wallet-id
        language: script
        pass_filenames: false
        always_run: true
